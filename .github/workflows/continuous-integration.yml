on:
  push:
    paths:
    - '**.rs'
    - 'Cargo.lock'
    - '**/Cargo.toml'
    - '.github/workflows/continuous-integration.yml'
  pull_request:
    paths:
    - '**.rs'
    - 'Cargo.lock'
    - '**/Cargo.toml'
    - '.github/workflows/continuous-integration.yml'

name: Continuous-integration

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Isolate application data
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/patchloom-config" >> "$GITHUB_ENV"
          cmake --version
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfreetype-dev libfontconfig-dev libxkbcommon-dev
          pkg-config --atleast-version=18.5.12 freetype2
          pkg-config --atleast-version=2.11.1 fontconfig
          pkg-config --modversion freetype2 fontconfig xkbcommon
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ubuntu24-rust1.99.1-check-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.99.1
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --locked --features no-self-update
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --locked --no-default-features --features opengl,no-self-update

  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Isolate application data
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/patchloom-config" >> "$GITHUB_ENV"
          cmake --version
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfreetype-dev libfontconfig-dev libxkbcommon-dev
          pkg-config --atleast-version=18.5.12 freetype2
          pkg-config --atleast-version=2.11.1 fontconfig
          pkg-config --modversion freetype2 fontconfig xkbcommon
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ubuntu24-rust1.99.1-test-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.99.1
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --locked --features no-self-update -- --skip catalog::tests::test_catalog_download
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --locked --no-default-features --features opengl,no-self-update -- --skip catalog::tests::test_catalog_download

  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.99.1
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Isolate application data
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/patchloom-config" >> "$GITHUB_ENV"
          cmake --version
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfreetype-dev libfontconfig-dev libxkbcommon-dev
          pkg-config --atleast-version=18.5.12 freetype2
          pkg-config --atleast-version=2.11.1 fontconfig
          pkg-config --modversion freetype2 fontconfig xkbcommon
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ubuntu24-rust1.99.1-clippy-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.99.1
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --all-targets --locked --features no-self-update -- -D warnings
