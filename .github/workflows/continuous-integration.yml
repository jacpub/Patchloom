on:
  push:
    paths:
    - '**.rs'
    - 'Cargo.lock'
    - '**/Cargo.toml'
    - '.github/workflows/continuous-integration.yml'
  pull_request:
    paths:
    - '**.rs'
    - 'Cargo.lock'
    - '**/Cargo.toml'
    - '.github/workflows/continuous-integration.yml'

name: Continuous-integration

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Isolate application data
        run: echo "XDG_CONFIG_HOME=$RUNNER_TEMP/patchloom-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-check-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --locked --features no-self-update
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --locked --no-default-features --features opengl,no-self-update

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Isolate application data
        run: echo "XDG_CONFIG_HOME=$RUNNER_TEMP/patchloom-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt install libxkbcommon-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --locked --features no-self-update -- --skip catalog::tests::test_catalog_download
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --locked --no-default-features --features opengl,no-self-update -- --skip catalog::tests::test_catalog_download

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Isolate application data
        run: echo "XDG_CONFIG_HOME=$RUNNER_TEMP/patchloom-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --all-targets --locked --features no-self-update -- -D warnings
